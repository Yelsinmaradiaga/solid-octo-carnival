<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NYC Turbo Jump</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(#101735, #111);
        color: #fff;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.8rem;
      }
      canvas {
        border: 3px solid #6fd6ff;
        border-radius: 12px;
        box-shadow: 0 0 25px rgba(111, 214, 255, 0.35);
        background: #2f5ea8;
        max-width: min(100vw - 24px, 920px);
        width: 100%;
        height: auto;
      }
      .hud {
        text-align: center;
        opacity: 0.95;
      }
      kbd {
        border: 1px solid #94d5ff;
        border-bottom-width: 3px;
        border-radius: 6px;
        padding: 2px 6px;
        background: rgba(255, 255, 255, 0.12);
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="hud">
        <strong>NYC Turbo Jump</strong> · Salta como en juegos de plataformas 🚗<br />
        <span><kbd>Espacio</kbd> / <kbd>↑</kbd> / click para saltar · <kbd>R</kbd> para reiniciar</span>
      </div>
      <canvas id="game" width="920" height="480"></canvas>
    </div>
    <script src="game.js"></script>
  </body>
</html>
